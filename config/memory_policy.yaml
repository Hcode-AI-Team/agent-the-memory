# Configurações de Política de Memória e FinOps

finops:
  # Custo aproximado por 1k tokens
  cost_per_1k_input: 0.00125  # gemini-1.5-pro
  cost_per_1k_output: 0.00500 # gemini-1.5-pro
  
  # Quantidade de tokens de um histórico completo (amnésico) para base de comparação
  amnesic_payload_tokens: 10000

vector_search:
  # Backend: chroma | vertex | mock (indexação e busca usam o mesmo)
  backend: chroma
  # Limite máximo de documentos retornados na busca
  max_documents: 3
  # Score mínimo de similaridade (cosine: max(0, 1 - distance) no Chroma).
  # Com embeddings locais (MiniLM), 0.35–0.55 costuma ser um bom intervalo;
  # com Vertex multilingual-002, valores mais altos (0.6–0.8) são comuns.
  min_similarity_score: 0.35
  # ChromaDB (quando backend: chroma)
  chroma:
    persist_directory: data/chroma
    collection_name: customer_insights
  # Vertex (quando backend: vertex)
  # Env: VECTOR_SEARCH_ENDPOINT_ID, VECTOR_SEARCH_INDEX_ID, VECTOR_SEARCH_GCS_BUCKET, GOOGLE_CLOUD_PROJECT, GOOGLE_CLOUD_REGION
  # Opcional: VECTOR_SEARCH_DEPLOYED_INDEX_ID (id do índice implantado no endpoint)
  vertex:
    index_id: ""          # ou env VECTOR_SEARCH_INDEX_ID
    gcs_bucket: ""        # ou env VECTOR_SEARCH_GCS_BUCKET (para batch upsert)
    deployed_index_id: "" # ou env VECTOR_SEARCH_DEPLOYED_INDEX_ID (para find_neighbors)
    content_store_path: data/vertex_content_store.jsonl  # id -> content para consulta
    gcs_prefix: vertex_batch
    is_complete_overwrite: false
  # Mock (quando backend: mock)
  mock:
    path: data/vector_store_mock.jsonl

session:
  # Tempo de vida do checkpoint da sessão em horas (ex: abandono de carrinho)
  ttl_hours: 48
  # Limite de recusas antes do Circuit Breaker (Handoff humano). Ajustável sem deploy.
  max_rejections: 3

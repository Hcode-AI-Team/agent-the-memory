# Configuração do pipeline de indexação (RAG)
# Assunto: insights de clientes, políticas e materiais de banco (especialistas)

chunking:
  chunk_size_chars: 512
  overlap_chars: 64
  strategy: recursive # fixed | by_paragraph | by_sentence | recursive | by_tokens (Lab 3)

csv:
  text_column: content # coluna com texto a chunkar (fallback: text)
  encoding: utf-8

json:
  text_path: content # campo de texto (ou path: data.text)
  encoding: utf-8

pdf:
  merge_pages: true # true = concatena páginas e chunka; false = 1 doc por página

embedding:
  # Backend: local | vertex | mock
  # local = sentence-transformers (offline, semântico; requer pip install -e ".[lab]")
  # vertex = Vertex AI (requer GOOGLE_CLOUD_PROJECT + GOOGLE_CLOUD_LOCATION)
  # mock = hash determinístico (só para CI/smoke; semântica limitada)
  # IMPORTANTE: trocar de backend exige apagar data/chroma e reindexar (dimensões diferentes).
  backend: local
  # Modelo local (384 dims) ou Vertex (text-multilingual-embedding-002 = 768 dims)
  model: paraphrase-multilingual-MiniLM-L12-v2
  batch_size: 5

vector_store:
  # Preenchido por env (VECTOR_SEARCH_ENDPOINT_ID) ou mock
  # endpoint_id: ...
  use_mock_if_unconfigured: true

Nao repita o conteudo do trecho. Nao explique. Responda apenas o contexto."""


def build_chunks(parsed: ParsedDoc, llm, embed) -> list[Chunk]:
    # 1) fronteiras respeitam a estrutura do documento (secao > paragrafo > frase)
    children = split_structural(parsed, target=400, min_size=120)

    # 2) contexto gerado uma vez por chunk; o documento base fica em cache
    #    de prompt, o que derruba o custo em ~1 ordem de magnitude
    ctxs = llm.batch(
        [CONTEXT_PROMPT.format(doc_title=parsed.title, vig=parsed.vigencia,
                               produto=parsed.produto, outline=parsed.outline,
                               chunk=c.text) for c in children],
        cache_prefix=parsed.raw_text,
    )

    out = []
    for c, ctx in zip(children, ctxs):
        searchable = f"{ctx}\\n\\n{c.text}"      # indexado no vetor E no BM25
        out.append(Chunk(
            id=c.id,
            text=c.text,                        # entregue ao gerador
            searchable_text=searchable,         # usado para recuperar
            parent_id=c.section_id,             # small-to-big na leitura
            embedding=embed(searchable, task="retrieval.passage"),
            sparse=bm25_tokens(searchable),
            meta=c.meta | {"breadcrumb": c.breadcrumb},
        ))
    return out`,

      function navItems(filter = "") {
        const f = filter.trim().toLowerCase();
        let lastGroup = null;
        return MODULES.map((m, i) => {
          const hay = (
            m.title +
            " " +
            (m.subtitle || "") +
            " " +
            (m.keywords || []).join(" ")
          ).toLowerCase();
          if (f && !hay.includes(f)) return "";
          const head =
            m.group !== lastGroup
              ? `<li class="px-3 pt-4 pb-1 text-[10px] uppercase tracking-[0.18em] text-slate-600 font-bold">${m.group}</li>`
              : "";
          lastGroup = m.group;
          const on = state.active === m.id;
          return (
            head +
            `<li>
              <button data-goto="${m.id}"
                class="w-full text-left px-3 py-2 rounded-lg text-[13px] transition-colors flex items-start gap-2.5 border-l-2 ${

                <span class="leading-snug">${m.title}</span>
              </button>
            </li>`
          );
        }).join("");
      }

            : `<div></div>`;
        return `<div class="grid md:grid-cols-2 gap-3 mt-12 pt-8 border-t border-slate-800">

      function goto(id) {
        const idx = MODULES.findIndex((m) => m.id === id);
        if (idx < 0) return;
        const m = MODULES[idx];
        state.active = id;
        destroyCharts();

        const blocks = (m.blocks || [])
          .map((b, i) => {
            const fn = R[b.kind];
            if (!fn) return "";
            return `<div class="fade-up" style="animation-delay:${Math.min(i * 45, 320)}ms">${fn(b)}</div>`;
          })
          .join("");

        container.innerHTML = `
          <div class="fade-up">${moduleHeader(m, idx)}</div>
          <div class="space-y-6">${blocks}</div>
          ${footerNav(idx)}`;

        renderNav(document.getElementById("nav-search").value);
        document.getElementById("progress-label").textContent =
          `${idx + 1}/${MODULES.length}`;
        document.getElementById("progress-bar").style.width =
          `${((idx + 1) / MODULES.length) * 100}%`;
        mainEl.scrollTop = 0;
        if (location.hash !== "#" + id)
          history.replaceState(null, "", "#" + id);

        requestAnimationFrame(() => {
          (m.blocks || []).forEach((b) => {
            if (b.kind === "chart" && CHARTS[b.id]) CHARTS[b.id]();
            if (b.kind === "plot" && PLOTS[b.id]) PLOTS[b.id]();
            if (b.kind === "widget" && WIDGETS[b.id])

          });
        });

        const dcg = (rels) =>
          rels.reduce(
            (s, r, i) => s + (Math.pow(2, r) - 1) / Math.log2(i + 2),
            0,
          );
        const ndcg = (ids, at = 5) => {
          const rels = ids.slice(0, at).map((id) => DOCS[id].rel);
          const ideal = Object.values(DOCS)
            .map((d) => d.rel)
            .sort((a, b) => b - a)
            .slice(0, at);
          const i = dcg(ideal);
          return i ? dcg(rels) / i : 0;
        };

        const fuse = () => {
          const bm25 = bm25List();
          const ids = new Set([
            ...bm25.map((x) => x[0]),
            ...dense.map((x) => x[0]),
          ]);
          const rankOf = (list, id) => {
            const i = list.findIndex((x) => x[0] === id);
            return i < 0 ? null : i + 1;
          };
          const norm = (list, id) => {
            const vals = list.map((x) => x[1]);
            const mn = Math.min(...vals),
              mx = Math.max(...vals);
            const hit = list.find((x) => x[0] === id);
            return hit ? (hit[1] - mn) / (mx - mn || 1) : 0;
          };
          return [...ids]
            .map((id) => {
              const rb = rankOf(bm25, id),
                rd = rankOf(dense, id);
              const rrf = (rb ? 1 / (k + rb) : 0) + (rd ? 1 / (k + rd) : 0);
              const sum = norm(bm25, id) + norm(dense, id);
              return { id, rb, rd, score: mode === "rrf" ? rrf : sum };

            ],
            answer:
              "Não encontrei norma vigente que sustente uma resposta segura sobre esse ponto. Vou te transferir para um especialista e registrar sua solicitação com o protocolo #48213.",
          },
        };
        let cur = "bom";
        const render = () => {
          const c = cases[cur];
          const a = ac(c.color);
          root.innerHTML = `
            <div class="flex flex-wrap gap-2 mb-4">
              ${Object.entries(cases)
                .map(
                  ([k2, v]) =>
                    `<button data-c="${k2}" class="${btnBase} ${k2 === cur ? btnOn : btnOff}">${v.name}</button>`,
                )
                .join("")}
            </div>
            <div class="grid md:grid-cols-5 gap-3 items-stretch">
              <div class="${CARD} p-4 md:col-span-2">
                <div class="text-[10.5px] uppercase tracking-wider text-slate-500 font-bold mb-1.5">1 · Contexto recuperado</div>
                <p class="text-[12.5px] text-slate-300 leading-relaxed">${c.ctx}</p>
                <div class="mt-3 pt-3 border-t border-slate-800">
                  <div class="text-[10.5px] uppercase tracking-wider text-slate-500 font-bold mb-1.5">2 · Avaliador de retrieval</div>
                  <div class="inline-flex items-center gap-2 ${a.g} border ${a.b} rounded px-2.5 py-1">
                    <span class="w-1.5 h-1.5 rounded-full ${a.d}"></span>
                    <span class="font-mono text-[11.5px] font-bold ${a.t}">${c.grade}</span>
                  </div>
                  <div class="font-mono text-[10.5px] text-slate-500 mt-2 leading-relaxed">${c.tokens}</div>
                </div>
              </div>
              <div class="${CARD} p-4 md:col-span-3 border-l-4 ${a.s}">
                <div class="text-[10.5px] uppercase tracking-wider font-bold ${a.t} mb-2">3 · Ação escolhida: ${c.action}</div>
                <ol class="space-y-2">
                  ${c.steps
                    .map(
                      (
                        s,
                        i,
                      ) => `<li class="flex gap-2.5 text-[12.5px] text-slate-300">
                        <span class="font-mono ${a.t} font-bold shrink-0">${i + 1}.</span><span class="leading-relaxed">${s}</span>
                      </li>`,
                    )
                    .join("")}
                </ol>
                <div class="mt-4 pt-3 border-t border-slate-800">
                  <div class="text-[10.5px] uppercase tracking-wider text-slate-500 font-bold mb-1.5">4 · Resposta ao cliente</div>
                  <p class="text-[13px] text-slate-200 italic leading-relaxed">"${c.answer}"</p>
                </div>
              </div>
            </div>`;
          root.querySelectorAll("[data-c]").forEach((b) => {
            b.onclick = () => {
              cur = b.dataset.c;
              render();
            };
          });
        };
        render();
      };

      // ---------------------------------------- 6. Traço agêntico (ReAct loop)
      WIDGETS.w_agentic = (root) => {
        const TRACE = [
          {
            t: "plan",
            h: "Plano",
            b: "A pergunta tem 3 incógnitas acopladas (elegibilidade, desconto, cobertura do seguro) e depende de dados do contrato. Plano: (1) estado do contrato via API; (2) política vigente; (3) regra do seguro; (4) verificar consistência; (5) responder com citações.",
            tok: 480,
            ms: 900,
          },
          {
            t: "tool",
            h: "Ferramenta: contratos.get(4471-9)",
            b: "Estado é dado transacional — jamais do índice vetorial.",
            tok: 210,
            ms: 260,
          },
          {
            t: "obs",
            h: "Observação",
            b: "74 dias de atraso · saldo R$ 38.410,22 · seguro prestamista ATIVO · sem ação judicial · fora da campanha PROMO-AUTO-2026.",
            tok: 190,
            ms: 0,
          },
          {
            t: "thought",
            h: "Raciocínio",
            b: "74 dias cai na faixa 61–120. Como está fora da campanha, a exceção de entrada zero não se aplica: preciso confirmar a entrada mínima para não prometer o que não existe.",
            tok: 260,
            ms: 700,
          },
          {
            t: "tool",
            h: "Ferramenta: kb.search (híbrido, filtros de vigência)",
            b: "query='quitação antecipada com atraso 61-120 dias desconto encargos entrada mínima' · filtros: produto=veiculo, vigente=hoje",
            tok: 320,
            ms: 480,
          },
          {
            t: "obs",
            h: "Observação",
            b: "NI-CRED-118 §2 (desconto até 35%) e §3 (entrada mínima de 10%, exceção só na campanha). Recuperado também NI-CRED-094 — revogada.",
            tok: 640,
            ms: 0,
          },
          {
            t: "reflect",
            h: "Reflexão (auto-crítica)",
            b: "Duas normas conflitam sobre o seguro. A §5 não diz se a cobertura vale antes da renegociação, e a norma que dizia 'sim' está revogada. Evidência insuficiente: não posso afirmar — busca dirigida antes de responder.",
            tok: 300,
            ms: 800,
          },
          {
            t: "tool",
            h: "Ferramenta: kb.search (sub-pergunta dirigida)",
            b: "query='seguro prestamista desemprego involuntário uso antes de renegociação carência' · top_k=8 · rerank=on",
            tok: 340,
            ms: 520,
          },
          {
            t: "obs",
            h: "Observação",
            b: "FAQ-SEGURO-07 (vigente): acionamento exige comprovação de desemprego involuntário e análise da seguradora em até 5 dias úteis; não suspende automaticamente a cobrança.",
            tok: 410,
            ms: 0,
          },
          {
            t: "verify",
            h: "Verificação de suporte factual",
            b: "3 afirmações numéricas → 3 citações válidas (35% → §2; entrada 10% → §3; 5 dias úteis → FAQ-SEGURO-07). 1 afirmação sem suporte foi removida ('cobertura imediata'). Nenhuma citação aponta para documento revogado.",
            tok: 380,
            ms: 900,
          },
          {
            t: "answer",
            h: "Resposta final",
            b: "Marcos, com 74 dias de atraso você é elegível à renegociação com até <b>35% de desconto sobre os encargos</b> (NI-CRED-118 §2). A entrada mínima é de <b>10% do saldo</b> — a campanha de entrada zero não se aplica ao seu contrato (§3). Sobre o seguro prestamista: ele existe e está ativo, mas o acionamento por desemprego involuntário depende de comprovação e análise da seguradora em até 5 dias úteis, e <b>não suspende a cobrança automaticamente</b> (FAQ-SEGURO-07). Quer que eu simule as duas opções?",
            tok: 620,
            ms: 1400,
          },
        ];
        const META = {
          plan: ["violet", "PLAN"],
          thought: ["blue", "THOUGHT"],
          tool: ["cyan", "ACTION"],
          obs: ["slate", "OBSERVATION"],
          reflect: ["amber", "REFLECT"],
          verify: ["emerald", "VERIFY"],
          answer: ["emerald", "ANSWER"],
        };
        const LIMITS = { calls: 6, ms: 9000, tok: 5000 };
        let n = 0,
          timer = null;

        const render = () => {
          const shown = TRACE.slice(0, n);
          const tok = shown.reduce((s, x) => s + x.tok, 0);
          const ms = shown.reduce((s, x) => s + x.ms, 0);
          const calls = shown.filter((x) => x.t === "tool").length;
          const meter = (label, v, max, unit, col) => `
            <div>
              <div class="flex justify-between text-[11px] mb-1"><span class="text-slate-400">${label}</span>
                <span class="font-mono ${v > max ? "text-rose-300" : "text-slate-300"}">${v}${unit} / ${max}${unit}</span></div>
              <div class="h-1.5 bg-slate-800 rounded-full overflow-hidden"><div class="h-full ${v > max ? "bg-rose-500" : col}" style="width:${Math.min(100, (v / max) * 100)}%"></div></div>
            </div>`;

          root.innerHTML = `
            <div class="grid lg:grid-cols-3 gap-4">
              <div class="lg:col-span-2">
                <div class="flex gap-2 mb-4 flex-wrap">
                  <button id="step" class="${btnBase} ${btnOn}" ${n >= TRACE.length ? "disabled" : ""}>Executar passo ▸</button>
                  <button id="run" class="${btnBase} ${btnOff}">Rodar tudo ⏩</button>
                  <button id="reset" class="${btnBase} ${btnOff}">Reiniciar ↺</button>
                  <span class="text-[11.5px] text-slate-500 self-center font-mono">passo ${n}/${TRACE.length}</span>
                </div>
                <div class="space-y-2 pl-3 trace-rail max-h-[30rem] overflow-y-auto custom-scroll pr-1">
                  ${
                    shown.length === 0
                      ? `<p class="text-[13px] text-slate-500 pl-4 py-6">Pergunta na fila: <span class="text-amber-200 italic">"consigo quitar antes do prazo com desconto mesmo atrasado? o seguro cobre?"</span><br/>Um RAG linear responderia agora — com uma única busca e nenhuma verificação.</p>`
                      : shown
                          .map((s, i) => {
                            const [c, tag] = META[s.t];
                            const a = ac(c);
                            const last = i === shown.length - 1;
                            return `<div class="relative pl-6 ${last ? "pulse-ring rounded-lg" : ""}">
                              <div class="absolute -left-[7px] top-3 w-3 h-3 rounded-full ${a.d} ring-4 ring-[#0b1220]"></div>
                              <div class="${CARD} p-3.5 ${last ? a.b : ""}">
                                <div class="flex items-center gap-2 mb-1 flex-wrap">
                                  <span class="pill ${a.b} ${a.t} ${a.g}">${tag}</span>
                                  <span class="font-semibold text-[13px] text-slate-200">${s.h}</span>
                                  <span class="ml-auto font-mono text-[10px] text-slate-600">${s.tok} tok · ${s.ms} ms</span>
                                </div>
                                <p class="text-[12.5px] text-slate-400 leading-relaxed">${s.b}</p>
                              </div>
                            </div>`;
                          })
                          .join("")
                  }
                </div>
              </div>

              <div class="space-y-3">
                <div class="${CARD} p-4 space-y-3">
                  <div class="text-[10.5px] uppercase tracking-wider font-bold text-slate-500">Orçamento do agente (guardrail)</div>
                  ${meter("Chamadas de ferramenta", calls, LIMITS.calls, "", "bg-cyan-500")}
                  ${meter("Latência acumulada", ms, LIMITS.ms, "ms", "bg-amber-500")}
                  ${meter("Tokens", tok, LIMITS.tok, "", "bg-blue-500")}
                  <p class="text-[11px] text-slate-500 leading-relaxed pt-1">Agente sem orçamento é incidente esperando acontecer: loop infinito de reflexão consome custo e SLA. Estoure o limite e a política é degradar (responder com o que tem + handoff), nunca insistir.</p>
                </div>
                <div class="${CARD} p-4 border-l-4 border-l-rose-500">
                  <div class="text-[10.5px] uppercase tracking-wider font-bold text-rose-300 mb-1.5">O que o RAG linear responderia</div>
                  <p class="text-[12px] text-slate-400 italic leading-relaxed">"Sim! Você tem até 50% de desconto e entrada zero, e o seguro cobre suas parcelas atrasadas."</p>
                  <p class="text-[11.5px] text-rose-300/80 mt-2">Três erros com aparência de simpatia: faixa errada (50% é 121–180 dias), campanha inaplicável e cobertura inventada. Fluente, confiante e caro.</p>
                </div>
                ${
                  n >= TRACE.length
                    ? `<div class="${CARD} p-4 border-l-4 border-l-emerald-500">
                        <div class="text-[10.5px] uppercase tracking-wider font-bold text-emerald-300 mb-1.5">Placar do episódio</div>
                        <ul class="text-[12px] text-slate-300 space-y-1">
                          <li>3 chamadas dirigidas (1 à API do contrato, 2 buscas) em vez de 1 busca genérica</li>
                          <li>1 conflito normativo resolvido por vigência</li>
                          <li>1 afirmação sem suporte removida antes de falar</li>
                          <li>Custo: ~${tok} tokens e ${(ms / 1000).toFixed(1)}s — o preço de não errar</li>
                        </ul>
                      </div>`
                    : ""
                }
              </div>
            </div>`;

          root.querySelector("#step").onclick = () => {
            if (n < TRACE.length) {
              n++;
              render();
            }
          };
          root.querySelector("#run").onclick = () => {
            clearInterval(timer);
            timer = setInterval(() => {
              if (n >= TRACE.length) return clearInterval(timer);
              n++;
              render();
            }, 620);
          };
          root.querySelector("#reset").onclick = () => {
            clearInterval(timer);
            n = 0;
            render();
          };
        };
        render();
      };

      // ------------------------------------ 7. Escrita e consolidação de memória
      WIDGETS.w_memory = (root) => {
        const TURNS = [
          {
            say: "Perdi o emprego em janeiro, por isso atrasei. Prefiro que falem comigo por WhatsApp, não ligue.",
            extract: [
              {
                type: "semântica",
                k: "situacao_emprego",
                v: "desempregado desde 2026-01",
                conf: 0.93,
                why: "fato durável sobre o cliente, muda a estratégia de negociação",
              },
              {
                type: "procedural",
                k: "canal_preferido",
                v: "whatsapp (não telefone)",
                conf: 0.97,
                why: "preferência que deve virar restrição de execução do agente",
              },
              {
                type: "episódica",
                k: "evento",
                v: "2026-07-27 · cliente revelou desemprego involuntário",
                conf: 1.0,
                why: "rastro auditável com timestamp",
              },
            ],
            conflict: null,
          },
          {
            say: "Consegui um trabalho novo, começo semana que vem. Já quero antecipar duas parcelas.",
            extract: [
              {
                type: "semântica",
                k: "situacao_emprego",
                v: "empregado a partir de 2026-08-03",
                conf: 0.9,
                why: "contradiz o fato anterior — não é erro, é o mundo mudando",
              },
              {
                type: "semântica",
                k: "intencao",
                v: "antecipar parcelas",
                conf: 0.86,
                why: "sinal de propensão que muda a oferta",
              },
            ],
            conflict: {
              old: "situacao_emprego = desempregado desde 2026-01",
              action:
                "Invalidar por tempo, não apagar: valid_to = 2026-08-02. O fato antigo continua explicando por que houve atraso.",
            },
          },
          {
            say: "(sem novidade nesta sessão — 40 turnos de small talk e confirmação de dados)",
            extract: [
              {
                type: "consolidação",
                k: "resumo_relacionamento",
                v: "Cliente com histórico de atraso por desemprego (jan–jul/2026), reempregado, perfil colaborativo, prefere WhatsApp, propenso a antecipar",
                conf: 0.88,
                why: "compactação dos episódios em um perfil estável — memória que caberia em 40 mil tokens agora cabe em 40",
              },
            ],
            conflict: null,
          },
        ];
        let i = 0;
        const store = [];
        const render = () => {
          const t = TURNS[Math.min(i, TURNS.length - 1)];
          root.innerHTML = `
            <div class="flex gap-2 mb-4 flex-wrap">
              <button id="nx" class="${btnBase} ${btnOn}" ${i >= TURNS.length ? "disabled" : ""}>Processar próximo turno ▸</button>
              <button id="rs" class="${btnBase} ${btnOff}">Reiniciar ↺</button>
              <span class="text-[11.5px] text-slate-500 self-center font-mono">turno ${Math.min(i + 1, TURNS.length)}/${TURNS.length}</span>
            </div>
            <div class="grid lg:grid-cols-2 gap-4">
              <div class="space-y-3">
                <div class="${CARD} p-4 border-l-4 border-l-amber-500">
                  <div class="text-[10.5px] uppercase tracking-wider text-amber-300 font-bold mb-1.5">Turno da conversa</div>
                  <p class="text-[13px] text-slate-200 italic">"${t.say}"</p>
                </div>
                <div class="${CARD} p-4">
                  <div class="text-[10.5px] uppercase tracking-wider text-slate-500 font-bold mb-2">Extração de memórias candidatas</div>
                  <div class="space-y-2">
                    ${t.extract
                      .map(
                        (
                          e,
                        ) => `<div class="border border-slate-800 rounded-lg p-2.5 bg-slate-900/60">
                          <div class="flex items-center gap-2 mb-1 flex-wrap">
                            <span class="pill pill-accent">${e.type}</span>
                            <span class="font-mono text-[11.5px] text-emerald-300">${e.k}</span>
                            <span class="ml-auto font-mono text-[10px] text-slate-500">conf ${e.conf}</span>
                          </div>
                          <div class="font-mono text-[11.5px] text-slate-300">${e.v}</div>
                          <div class="text-[11px] text-slate-500 mt-1">${e.why}</div>
                        </div>`,
                      )
                      .join("")}
                  </div>
                </div>
                ${
                  t.conflict
                    ? `<div class="bg-rose-500/10 border border-rose-500/30 rounded-lg p-3.5">
                        <div class="text-[10.5px] uppercase tracking-wider font-bold text-rose-300 mb-1.5">Conflito detectado</div>
                        <div class="font-mono text-[11.5px] text-slate-400 line-through">${t.conflict.old}</div>
                        <p class="text-[12.5px] text-slate-300 mt-2">${t.conflict.action}</p>
                      </div>`
                    : ""
                }
              </div>
              <div class="${CARD} p-4">
                <div class="text-[10.5px] uppercase tracking-wider text-slate-500 font-bold mb-2">Estado da memória do cliente</div>
                ${
                  store.length === 0
                    ? `<p class="text-[12.5px] text-slate-500 py-6">Vazio. Um agente que começa sempre daqui é o "agente amnésico": simpático, competente e insuportável de conversar duas vezes.</p>`
                    : `<div class="space-y-1.5">${store
                        .map(
                          (
                            s,
                          ) => `<div class="flex items-start gap-2 text-[12px] p-2 rounded ${s.dead ? "opacity-45" : "bg-slate-800/40"}">
                            <span class="pill shrink-0">${s.type}</span>
                            <div class="flex-1">
                              <div class="font-mono text-[11.5px] ${s.dead ? "text-slate-500 line-through" : "text-slate-200"}">${s.k} = ${s.v}</div>
                              ${s.dead ? `<div class="text-[10.5px] text-rose-400/80">valid_to fechado — histórico preservado para auditoria</div>` : ""}
                            </div>
                          </div>`,
                        )
                        .join("")}</div>`
                }
                <div class="mt-4 pt-3 border-t border-slate-800 text-[11.5px] text-slate-500 leading-relaxed">
                  Três decisões separam memória de agente de um simples log: <b class="text-slate-300">o que escrever</b> (nem tudo é fato),
                  <b class="text-slate-300">como resolver contradição</b> (versionar no tempo, não sobrescrever) e
                  <b class="text-slate-300">quando esquecer</b> (decaimento por relevância e recência). Sem as três, a memória degenera em lixo confiante.
                </div>
              </div>
            </div>`;
          root.querySelector("#nx").onclick = () => {
            if (i >= TURNS.length) return;
            const t2 = TURNS[i];
            if (t2.conflict) {
              const old = store.find(
                (s) => t2.conflict.old.startsWith(s.k) && !s.dead,
              );
              if (old) old.dead = true;
            }
            t2.extract.forEach((e) =>
              store.push({ type: e.type, k: e.k, v: e.v }),
            );
            i++;
            render();
          };
          root.querySelector("#rs").onclick = () => {
            i = 0;
            store.length = 0;
            render();
          };
        };
        render();
      };

      // ------------------------------------------------------------------ boot
      renderNav();
      goto(location.hash.slice(1) || MODULES[0].id);
    </script>
  </body>
</html>
